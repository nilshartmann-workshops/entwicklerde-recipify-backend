components:
  schemas:
    AdminFeedbackDto:
      type: object
      properties:
        approvalStatus:
          $ref: "#/components/schemas/ApprovalStatus"
        comment:
          type: string
        commenter:
          type: string
        createdAt:
          type: string
          format: date-time
        id:
          type: string
        rating:
          type: integer
          format: int32
        recipeId:
          type: string
        recipeTitle:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
      - approvalStatus
      - comment
      - commenter
      - createdAt
      - id
      - rating
      - recipeId
      - recipeTitle
      - updatedAt
    AdminRecipeDto:
      type: object
      properties:
        categoryIds:
          type: array
          items:
            type: string
        cookTime:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        feedbackCount:
          type: integer
          format: int64
        headline:
          type: string
        id:
          type: string
        image:
          $ref: "#/components/schemas/ImageDto"
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/IngredientDto"
        instructions:
          type: array
          items:
            $ref: "#/components/schemas/InstructionDto"
        likes:
          type: integer
          format: int32
        mealTypeId:
          type: string
        preparationTime:
          type: integer
          format: int32
        title:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
      - categoryIds
      - createdAt
      - feedbackCount
      - headline
      - id
      - image
      - ingredients
      - instructions
      - likes
      - mealTypeId
      - title
      - updatedAt
    ApprovalStatus:
      type: string
      enum:
      - APPROVAL_PENDING
      - APPROVED
      - REJECTED
    CategoryDto:
      type: object
      properties:
        description:
          type: string
        icon:
          type: string
        id:
          type: string
        title:
          type: string
        type:
          type: string
      required:
      - description
      - icon
      - id
      - title
      - type
    DetailedRecipeDto:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryDto"
        cookTime:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        headline:
          type: string
        id:
          type: string
        image:
          $ref: "#/components/schemas/ImageDto"
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/Ingredient"
        instructions:
          type: array
          items:
            $ref: "#/components/schemas/Instruction"
        likes:
          type: integer
          format: int32
        mealType:
          type: string
        preparationTime:
          type: integer
          format: int32
        title:
          type: string
        userFullname:
          type: string
      required:
      - categories
      - cookTime
      - createdAt
      - headline
      - id
      - image
      - ingredients
      - instructions
      - likes
      - mealType
      - preparationTime
      - title
      - userFullname
    ExploreRecipeDto:
      type: object
      properties:
        id:
          type: string
        image:
          $ref: "#/components/schemas/ImageDto"
        mealType:
          type: string
        title:
          type: string
      required:
      - id
      - image
      - mealType
      - title
    Feedback:
      type: object
      properties:
        approvalStatus:
          $ref: "#/components/schemas/ApprovalStatus"
        comment:
          type: string
        commenter:
          type: string
        createdAt:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        rating:
          type: integer
          format: int32
        updatedAt:
          type: string
          format: date-time
      required:
      - comment
      - commenter
      - createdAt
      - rating
      - updatedAt
    FeedbackDto:
      type: object
      properties:
        comment:
          type: string
        commenter:
          type: string
        createdAt:
          type: string
          format: date-time
        id:
          type: string
        rating:
          type: integer
          format: int32
      required:
      - comment
      - commenter
      - createdAt
      - id
      - rating
    GetRecipeFeedbacksResponse:
      type: object
      properties:
        feedbacks:
          type: array
          items:
            $ref: "#/components/schemas/Feedback"
      required:
      - feedbacks
    GetRecipeIngredientsResponse:
      type: object
      properties:
        id:
          type: string
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/Ingredient"
      required:
      - id
      - ingredients
    GetRecipeResponse:
      type: object
      properties:
        recipe:
          $ref: "#/components/schemas/DetailedRecipeDto"
      required:
      - recipe
    GetSearchDetailResponse:
      type: object
      properties:
        recipe:
          $ref: "#/components/schemas/RecipeDto"
      required:
      - recipe
    ImageDto:
      type: object
      properties:
        id:
          type: string
        src:
          type: string
        title:
          type: string
      required:
      - id
      - src
      - title
    IncrementLikesResponse:
      type: object
      properties:
        newLikes:
          type: integer
          format: int32
        recipeId:
          type: string
      required:
      - newLikes
      - recipeId
    Ingredient:
      type: object
      properties:
        amount:
          type: number
          format: double
        name:
          type: string
        orderNo:
          type: integer
          format: int32
        unit:
          type: string
      required:
      - amount
      - name
      - orderNo
      - unit
    IngredientDto:
      type: object
      properties:
        amount:
          type: number
          format: double
        name:
          type: string
        unit:
          type: string
      required:
      - amount
      - name
      - unit
    IngredientRequest:
      type: object
      properties:
        amount:
          type: number
          format: double
        name:
          type: string
        unit:
          type: string
      required:
      - amount
      - name
      - unit
    Instruction:
      type: object
      properties:
        description:
          type: string
        orderNo:
          type: integer
          format: int32
    InstructionDto:
      type: object
      properties:
        description:
          type: string
      required:
      - description
    InstructionRequest:
      type: object
      properties:
        description:
          type: string
      required:
      - description
    LoginRequest:
      type: object
      properties:
        password:
          type: string
        username:
          type: string
      required:
      - password
      - username
    LoginResponse:
      type: object
      properties:
        message:
          type: string
    MeDto:
      type: object
      properties:
        fullname:
          type: string
      required:
      - fullname
    MealTypeDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    NewApprovalStatus:
      type: string
      enum:
      - APPROVED
      - REJECTED
    NewFeedback:
      type: object
      properties:
        comment:
          type: string
        commenter:
          type: string
          maxLength: 2147483647
          minLength: 3
        stars:
          type: integer
          format: int32
          maximum: 5
          minimum: 0
      required:
      - comment
      - commenter
      - stars
    PageResponseAdminFeedbackDto:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/AdminFeedbackDto"
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean
        meta:
          type: string
        pageNumber:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
      required:
      - content
      - hasNext
      - hasPrevious
      - pageNumber
      - totalPages
    PageResponseAdminRecipeDto:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/AdminRecipeDto"
        hasNext:
