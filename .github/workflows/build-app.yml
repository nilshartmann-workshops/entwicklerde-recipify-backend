on:
  push:
    branches:
      - main

jobs:
  backend:
    env:
      REGISTRY: ghcr.io

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install JDK24
        uses: actions/setup-java@v3
        with:
          distribution: "temurin" # See 'Supported distributions' for available options
          java-version: "24"
      - run: ./mvnw --no-transfer-progress -DskipTests package
      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${GITHUB_SHA} | cut -c 1-7)" >> "$GITHUB_OUTPUT"
      - name: Build and push JVM Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/entwicklerde-recipify-backend:latest
            ghcr.io/${{ github.actor }}/entwicklerde-recipify-backend:${{ steps.sha.outputs.short }}